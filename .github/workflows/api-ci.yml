# TestFlow-Mall 接口自动化回归（GitHub Actions + Allure）
# 触发：api-test 或本 workflow 变更时自动回归；也可手动触发（workflow_dispatch）
# 流程：起 MySQL/Redis 服务 → 检出被测系统 mall（锁定 commit）→ 初始化 mall.sql →
#       构建并启动 mall-admin → 执行 41 条接口用例（含数据库一致性断言）→ Allure 报告上传
name: API 接口自动化回归

on:
  push:
    branches: [main, master]
    paths:
      - "api-test/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "api-test/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

jobs:
  api-regression:
    name: 接口回归 + Allure 报告
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: mall
          MYSQL_USER: mall
          MYSQL_PASSWORD: mall123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 检出测试仓库
        uses: actions/checkout@v4

      - name: 检出被测系统源码（锁定 commit 0504e86）
        run: |
          git clone https://github.com/macrozheng/mall.git mall
          cd mall
          git checkout 0504e86b1f1b6f1b8aa6a734d37a90fb67346be7

      - name: 设置 JDK 17（Maven 依赖缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 安装 MySQL 客户端并初始化种子数据
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client-core-8.0
          # mall.sql 为全量初始化脚本（Navicat 导出，无 USE 语句），须显式指定目标库 mall
          mysql -h 127.0.0.1 -P 3306 -u mall -pmall123456 mall < mall/document/sql/mall.sql
          mysql -h 127.0.0.1 -P 3306 -u mall -pmall123456 -e "SELECT COUNT(*) AS products FROM mall.pms_product WHERE delete_status=0"

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 mall-admin
        run: |
          cd mall
          mvn -B -q -pl mall-admin -am package -DskipTests -Ddocker.skip=true

      - name: 启动 mall-admin 后端
        run: |
          cd mall/mall-admin/target
          nohup java -jar mall-admin-1.0-SNAPSHOT.jar \
            --spring.datasource.url='jdbc:mysql://127.0.0.1:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true' \
            --spring.datasource.username=mall \
            --spring.datasource.password=mall123456 \
            > mall-admin.log 2>&1 &

      - name: 等待后端就绪
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "backend ready after $((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::backend not ready in 300s"
          tail -80 mall/mall-admin/target/mall-admin.log
          exit 1

      - name: 安装测试依赖并执行接口回归（41 条）
        run: |
          python -m pip install -r api-test/requirements.txt
          cd api-test
          python -m pytest --alluredir=allure-results --clean-alluredir -q
        env:
          MALL_BASE_URL: http://localhost:8080
          MALL_DB_HOST: 127.0.0.1
          MALL_DB_PORT: "3306"
          MALL_DB_USER: mall
          MALL_DB_PASS: mall123456
          MALL_DB_NAME: mall

      - name: 生成 Allure 报告
        if: always()
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.zip -o allure.zip
          unzip -q allure.zip
          ./allure-2.30.0/bin/allure generate api-test/allure-results -o allure-report --clean

      - name: 上传 Allure 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: 上传测试结果（allure-results）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: api-test/allure-results
